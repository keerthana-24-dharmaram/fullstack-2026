<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Employee Registration Form</title>
</head>
<body style="background-color:blanchedalmond">

    <h1>Employee Registration Form</h1>

    <form action="submit_employee" method="post">

        <!-- Personal Information -->
        <fieldset style="background-color: blueviolet;">
            <legend>Personal Information</legend>

            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname" required><br><br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname" required><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob" required><br><br>

            <label for="gender">Gender:</label><br>
            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label><br>
            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label><br>
            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label><br><br>
        </fieldset>

        <!-- Contact Information -->
        <fieldset>
            <legend>Contact Information</legend>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required><br><br>

            <label for="phone">Phone Number:</label>
            <input type="tel" id="phone" name="phone" required><br><br>

            <label for="address">Address:</label><br>
            <textarea id="address" name="address" rows="4" cols="40"></textarea><br><br>
        </fieldset>

        <!-- Employment Information -->
        <fieldset>
            <legend>Employment Information</legend>

            <label for="empid">Employee ID:</label>
            <input type="text" id="empid" name="empid" required><br><br>

            <label for="department">Department:</label>
            <select id="department" name="department">
                <option value="hr">Human Resources</option>
                <option value="finance">Finance</option>
                <option value="it">Information Technology</option>
                <option value="sales">Sales</option>
                <option value="marketing">Marketing</option>
            </select><br><br>

            <label for="designation">Designation:</label>
            <input type="text" id="designation" name="designation" required><br><br>

            <label for="doj">Date of Joining:</label>
            <input type="date" id="doj" name="doj" required><br><br>

            <label>Skills:</label><br>
            <input type="checkbox" id="communication" name="skills" value="Communication">
            <label for="communication">Communication</label><br>
            <input type="checkbox" id="leadership" name="skills" value="Leadership">
            <label for="leadership">Leadership</label><br>
            <input type="checkbox" id="programming" name="skills" value="Programming">
            <label for="programming">Programming</label><br>
            <input type="checkbox" id="management" name="skills" value="Management">
            <label for="management">Management</label><br><br>
        </fieldset>

        <!-- File Upload -->
        <fieldset>
            <legend>Upload Documents</legend>
            <label for="photo">Upload Photo:</label>
            <input type="file" id="photo" name="photo"><br><br>

            <label for="resume">Upload Resume:</label>
            <input type="file" id="resume" name="resume"><br><br>
        </fieldset>

        <!-- Submit Section -->
        <fieldset>
            <legend>Confirmation</legend>
            <input type="checkbox" id="agree" name="agree" required>
            <label for="agree">I confirm that the above information is correct.</label><br><br>

            <input type="submit" value="Register">
            <input type="reset" value="Reset">
        </fieldset>

    </form>

</body>
</html>
